services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      # Shared across worktrees (API key, OIDC, limits). Optional so a single-tree checkout
      # with one fat .env, and CI, both keep working with no such file.
      - path: .env.shared
        required: false
      # This worktree's stack identity. Listed second so it wins on any overlapping key.
      - .env
    environment:
      # Inside the container the frontend is reached from the browser, so CORS uses the
      # host-facing origin defined in .env.
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      # Reach Postgres over the compose network by service name (overrides any localhost
      # DATABASE_URL from .env, which is only correct for host-run processes).
      DATABASE_URL: postgres://app:app@postgres:5432/app
      # Same for Redis: reach it by compose service name. The backend refuses to start
      # without this (D6) — the request quota is not optional.
      REDIS_URL: redis://redis:6379
      # The app default is 8080 (Cloud Run's contract). Pinned here so the published mapping
      # below, the README's curl commands and the SPA's VITE_API_BASE default all keep working.
      PORT: "8000"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # The backend launches *sibling* sandbox containers via the host Docker daemon.
      # This is the local-dev seam that a CloudRunBackend would replace in GCP.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      sandbox-image-builder:
        condition: service_started
      # Wait until Postgres accepts connections so the boot migration doesn't race it.
      postgres:
        condition: service_healthy
      # Likewise Redis: the backend asserts REDIS_URL at boot and the first request needs it.
      redis:
        condition: service_healthy

  # One-shot service that builds the sandbox EXECUTION image into the host daemon so the
  # backend can run it. It exits 0 after building.
  sandbox-image-builder:
    image: docker:27-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./backend/sandbox-image:/build
    working_dir: /build
    command: ["build", "-t", "${SANDBOX_IMAGE:-llm-sandbox:latest}", "."]
    entrypoint: ["docker"]

  # Per-user chat history datastore. Data persists in the named `pgdata` volume across
  # restarts. Credentials match the DATABASE_URL above (app/app/app).
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Exposed on the host so local integration tests can reach it. The host port is
    # slot-derived so two worktrees' stacks do not fight over 5432.
    ports:
      - "${PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Quota counters for the per-user rate limiter. Deliberately has NO volume: the counters are
  # windowed and disposable, and losing them on restart costs at most one window of
  # over-allowance. (The backend still refuses to boot without this service — D6.)
  redis:
    image: redis:7-alpine
    # Exposed on the host so local integration tests can reach it; slot-derived like Postgres.
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE: http://localhost:${BACKEND_PORT:-8000}
      # Vite binds this inside the container too, so the mapping is port:port. `loadEnv` merges
      # prefixed process.env over the .env files, so this wins over a copied-in .env.local.
      VITE_DEV_PORT: "${FRONTEND_PORT:-5173}"
    ports:
      - "${FRONTEND_PORT:-5173}:${FRONTEND_PORT:-5173}"
    depends_on:
      - backend

volumes:
  pgdata:

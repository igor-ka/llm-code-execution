# Scheduled version updates. Security updates are enabled separately in repository settings and
# ignore `schedule` and `open-pull-requests-limit` here — but they DO honour a `groups` block
# that sets `applies-to: security-updates`.
#
# Both package.json files live one level down, so `directory:` must name them explicitly; a
# single "/" entry silently matches nothing and Dependabot reports no error.
#
# TWO INVARIANTS, both learned the hard way:
#
# 1. Every group is declared TWICE — once for version updates, once with
#    `applies-to: security-updates`. `applies-to` defaults to `version-updates`, so a single
#    group silently covers only half, and both PRs that first motivated grouping (#77, #78)
#    were security updates. See issue #56, finding 3.
#
# 2. A group must contain the whole peer-connected component, not a convenient subset. Split a
#    bounded peer range across two PRs and each half dies at `npm ci` — #78, #102, #107 and
#    #109 are four instances of exactly that. `typescript-eslint` peers on BOTH `typescript`
#    and `eslint`, so those two clusters are one group, not two.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint@8.67.0 — the latest — still declares `typescript: ">=4.8.4 <6.1.0"`,
      # while typescript is on 7.0.2. No compatible pair exists, so grouping cannot save this
      # one: Dependabot generates a lockfile anyway (it falls back to --legacy-peer-deps) and
      # the PR dies at `npm ci`, which is what #107 and #102 are. Ignoring the major keeps that
      # PR from being re-raised indefinitely.
      #
      # `update-types` affects VERSION updates only — a typescript security advisory still
      # comes through. Remove this entry once typescript-eslint widens its peer range.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      # Peer-linked packages must move together. Ungrouped, a vite major lands while its
      # peers stay pinned and the PR dies at `npm ci`.
      #
      # Only `vitest` is a direct dependency here today, so this group is one package for
      # version updates. It is kept for symmetry and for when vite lands directly.
      vite-toolchain:
        patterns:
          - vite
          - vitest
          - "@vitest/*"
      # The one that actually bites for the backend: `vite` AND `esbuild` are transitive here
      # (esbuild@0.28.1 is hoisted in package-lock.json today), and security updates are the
      # only path that reaches transitive dependencies. `esbuild` appears only in the security
      # groups for exactly that reason — a version-updates group would never match it.
      vite-toolchain-security:
        applies-to: security-updates
        patterns:
          - vite
          - vitest
          - "@vitest/*"
          - esbuild
      # One group, not two: `typescript-eslint` peers on `typescript` AND on `eslint`, so the
      # two clusters are a single peer-connected component. `@eslint/js@10.0.1` peers
      # `eslint: ^10.0.0` — a hard major-for-major lock — so an eslint major split across two
      # PRs is the #107 failure again with different names.
      lint-toolchain:
        patterns:
          - typescript
          - typescript-eslint
          - "@typescript-eslint/*"
          - eslint
          - "@eslint/*"
          - eslint-config-prettier
          - "eslint-plugin-*"
      lint-toolchain-security:
        applies-to: security-updates
        patterns:
          - typescript
          - typescript-eslint
          - "@typescript-eslint/*"
          - eslint
          - "@eslint/*"
          - eslint-config-prettier
          - "eslint-plugin-*"
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Same bounded peer range as the backend; see the comment there.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      # The frontend groups additionally carry @vitejs/* — @vitejs/plugin-react declares a
      # peer range on vite, and leaving it behind is exactly what broke PR #78.
      vite-toolchain:
        patterns:
          - vite
          - vitest
          - "@vitest/*"
          - "@vitejs/*"
      # PR #78 was an *esbuild* advisory that also carried vite, vitest and coverage-v8 — and it
      # is the PR that broke. `esbuild` is not in the frontend lock right now (vite 8 dropped
      # it), but it was last week; a security group has to name the transitives that come and go.
      vite-toolchain-security:
        applies-to: security-updates
        patterns:
          - vite
          - vitest
          - "@vitest/*"
          - "@vitejs/*"
          - esbuild
      lint-toolchain:
        patterns:
          - typescript
          - typescript-eslint
          - "@typescript-eslint/*"
          - eslint
          - "@eslint/*"
          - eslint-config-prettier
          - "eslint-plugin-*"
      lint-toolchain-security:
        applies-to: security-updates
        patterns:
          - typescript
          - typescript-eslint
          - "@typescript-eslint/*"
          - eslint
          - "@eslint/*"
          - eslint-config-prettier
          - "eslint-plugin-*"
      # PR #109 raised @types/react to 19 while @types/react-dom stayed on 18 and could not
      # resolve. The group also carries the packages that BOUND react rather than just the
      # react packages themselves: @testing-library/react peers all four at ^18 || ^19, and
      # @auth0/auth0-react — a runtime dependency — peers react/react-dom on an even narrower
      # range. Omit them and react 20 reproduces #109 with the group in place.
      # @testing-library/dom is here because @testing-library/react peers it at ^10.0.0.
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
          - "@testing-library/react"
          - "@testing-library/dom"
          - "@auth0/auth0-react"
      react-security:
        applies-to: security-updates
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
          - "@testing-library/react"
          - "@testing-library/dom"
          - "@auth0/auth0-react"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # --- docker ---------------------------------------------------------------------------------
  #
  # The three node images move as ONE entry via `directories`, because they must move together.
  # `Dockerfile` (the production image, SPA + API in one container — missing from the issue's
  # proposal), `backend/Dockerfile` and `frontend/Dockerfile` all pin `node:22-slim`. As separate
  # entries a node major would arrive as three independent PRs merging at three different times,
  # leaving the production image on one major while the backend dev image sat on another — each
  # PR green on its own, nothing catching the divergence. Same "must move together" reasoning as
  # invariant 2 above, applied across directories rather than across packages.
  #
  # WHAT THIS DOES AND DOES NOT BUY. Every base image is pinned by TAG (`node:22-slim`,
  # `python:3.12-slim`, `postgres:16`), not by digest, so Dependabot fires only when the TAG
  # changes — node 22 -> 24, postgres 16 -> 17. It does not fire when upstream rebuilds the same
  # tag with patched OS packages. Nor does a local rebuild reliably pick that up: `docker build`
  # reuses a cached base image unless the cache lacks it or `--pull` is passed. Both `verify.sh`
  # scripts now pass it (#174), so a local image build no longer lags CI — but that refreshes the
  # tag, it does not tell anyone a newer tag exists. So this is major/minor NOTIFICATION, not
  # patch-level freshness. Digest pins would invert the trade — every upstream rebuild becomes a
  # PR — and are a separate decision.
  #
  # NOT eligible for auto-merge, and nothing here has to arrange that. The gate in
  # `dependabot-auto-merge.yml` is a positive allow-list: the job-level `if:` requires
  # `dependabot/npm_and_yarn/`, and rule 2 rejects any entry whose `packageEcosystem` is not
  # `npm_and_yarn`. A new ecosystem is ineligible by construction rather than by an exclusion
  # someone has to remember to add.
  - package-ecosystem: docker
    directories:
      - /
      - /backend
      - /frontend
    schedule:
      interval: weekly
    groups:
      node-base:
        patterns:
          - node
      node-base-security:
        applies-to: security-updates
        patterns:
          - node
  # The sandbox EXECUTION image, deliberately its own entry — a different base (python) on a
  # different cadence, and the containment boundary around LLM-generated code. `CLAUDE.md` routes
  # any change to it through `security-and-hardening`, so its bumps arrive alone and are reviewed
  # on their own terms rather than bundled with a routine node bump.
  - package-ecosystem: docker
    directory: /backend/sandbox-image
    schedule:
      interval: weekly

  # --- docker-compose -------------------------------------------------------------------------
  #
  # A SEPARATE ecosystem: `docker` parses Dockerfiles only, so none of the entries above reach
  # `docker-compose.yml`, which pins `postgres:16`, `redis:7-alpine` and `docker:27-cli` — the
  # last of these being the sandbox-image builder that bind-mounts the Docker socket. Without
  # this entry the local dev stack and the integration suites would sit on Postgres 16
  # indefinitely with no PR ever raised: exactly the invisible ageing the docker entries exist to
  # stop.
  #
  # Note what is still uncovered: `.github/workflows/ci.yml` pins the same `postgres:16` and
  # `redis:7-alpine` as SERVICE CONTAINERS, and no ecosystem reaches those — `github-actions`
  # updates `uses:` refs, not `image:` values. Those copies have to be kept in step by hand, and a
  # docker-compose PR that bumps Postgres is the prompt to do it.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly

name: Deploy scripts

# scripts/deploy-cloud-run.sh and scripts/verify-deployment.sh have no workflow that runs them on a
# pull request. There is no deploy workflow in this repository yet — Phase 3 of epic #79 is in
# progress and the environment has been torn down since 2026-08-25 — and when it lands it will run
# on pushes to `main`, so a PR that edits either script will still never execute it. Their unit
# tests lodged in `SDLC docs` for that reason, and the carried copy of that workflow does not carry
# them — it cannot, because it knows nothing about Cloud Run.
#
# They get their own job rather than a step in an existing one. `Terraform checks` is wrong by
# subject; `Backend checks` already means something else. It is added to the ruleset's required
# checks the moment this workflow reaches `main` — not in the pull request that creates it, because
# a required check whose job does not yet exist on the default branch blocks every merge including
# its own. Until then this job reports without gating, which is a downgrade from `SDLC docs`
# (required) and is why the ruleset edit is the very next step rather than a follow-up.
#
# NO `paths:` filter, deliberately — a workflow-level path filter on a required check makes it
# never report at all, which hangs every merge forever. .github/workflows/terraform.yml carries a
# comment about the same trap. Both suites drive fakes on PATH and run in seconds.
#
# WHAT THIS JOB IS FOR, now that it holds more than two deploy scripts: the unit tests for
# repo-root `scripts/` that no component's `verify.sh` owns and no other workflow runs. The name is
# a ruleset contract and stays, but read it as "repo-root script tests" — `apply-ruleset.test.sh` is
# about branch protection and the four mutation suites are about the mutation gate, neither of which
# is a deploy.
#
# The mutation suites were briefly reached only through `backend/verify.sh mutation`. That was the
# wrong owner twice over: it coupled the backend component's gate to repo-root tooling, and because
# that target is outside `all` and gated on `pull_request` in ci.yml, a change to
# `scripts/mutation-scope.sh` landing on `main` was never re-tested. They need no npm install —
# plain bash, git and node — so they belong here, where they also run in seconds.
#
# `mutation-gate.test.sh` deliberately stays behind in `./verify.sh mutation:selftest`: it drives a
# real Stryker against a fixture and needs `backend/node_modules`, which this job does not install.
#
# The job `name:` is a contract like the others. See docs/sdlc.md.

on:
  pull_request:
    branches: [main]

concurrency:
  group: deploy-scripts-${{ github.ref }}
  cancel-in-progress: true

# Read-only. Both suites drive fake `gcloud`, `docker`, `curl` and verifier executables on PATH —
# no project, no credentials, no network. They run scripts from the PR branch, so this job must
# never hold a writable token.
permissions:
  contents: read

jobs:
  deploy-scripts:
    name: Deploy scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test the Cloud Run deploy script
        run: ./scripts/tests/deploy-cloud-run.test.sh
      - name: Test the deployment verification script
        run: ./scripts/tests/verify-deployment.test.sh
      # A third script no `verify.sh` owns and no other workflow runs. It mutates branch
      # protection — the one piece of this repository's configuration with no undo short of a
      # saved copy — so it is the last script that should ship untested. The carried
      # `sdlc-docs.yml` cannot host it: it is byte-identical in every consumer and knows nothing
      # about this one. Driven by a fake `gh` on PATH; applies nothing.
      - name: Test the ruleset apply script
        run: ./scripts/tests/apply-ruleset.test.sh
      # The mutation gate's own tooling. These decide whether a mutant blocks a merge, so a gate
      # whose decision logic is untested is a gate that reads as coverage and provides none.
      - name: Test the mutation scope script
        run: ./scripts/tests/mutation-scope.test.sh
      - name: Test the mutation decision script
        run: ./scripts/tests/mutation-decide.test.sh
      - name: Test the mutation suppression rule
        run: ./scripts/tests/mutation-suppressions.test.sh

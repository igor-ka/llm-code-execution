name: Dependabot auto-merge

# Arms GitHub's native auto-merge on Dependabot PRs that only move patch or minor versions.
# See "Auto-merging dependency bumps" in docs/sdlc.md, and issue #94.
#
# This is NOT a check and must never be added to the "Protect main" ruleset's required status
# checks. The four gates (Backend checks, Frontend checks, SDLC docs, PR shape) still decide
# whether the PR is mergeable; this workflow only presses the button in advance. It is therefore
# also not subject to the "every CI check has a verify.sh equivalent" rule — it gates nothing.
#
# Why `pull_request` and NOT `pull_request_target`: pull_request_target runs in the base repo's
# context with a writable token, which is the standard way to turn a dependency bot into a
# code-execution path. It is not needed here — Dependabot's branches live in this repository, so
# a plain `pull_request` run can be granted write via a `permissions:` block.
#
# Why there is no `actions/checkout` step anywhere: `apply` below holds the only writable
# GITHUB_TOKEN in this repository's CI. Checking out the head ref would put code from the PR
# branch inside it. Every input either job needs arrives as event metadata or as an action
# output, so neither needs a working tree. If a future change needs the repository, check out
# `${{ github.event.pull_request.base.sha }}`, never the head.
#
# WHY TWO JOBS. `gate` runs the one third-party action under a read-only token and publishes a
# verdict; `apply` holds the write scope and runs nothing but `gh`. They are split because
# `contents: write` turned out to be mandatory (see `apply`), and in one job that scope would be
# handed to `dependabot/fetch-metadata` — making the SHA pin the only thing standing between a
# compromised action release and a push to `main`. The split turns a supply-chain assumption into
# a scope boundary. The SHA pin stays, as defence in depth rather than the load-bearing control.

on:
  pull_request:
    branches: [main]
    # `synchronize` matters: Dependabot rebases its open PRs when main moves, and that rebase is
    # the event that runs this workflow for a PR opened before it existed. (The workflow file is
    # read from the merge commit, so the PR branch does not have to contain it — it just needs an
    # event.)
    #
    # `reopened` is deliberately dropped from the default set. Check results are keyed to the head
    # SHA and survive a close/reopen, so reopening a PR whose checks are already green and whose
    # threads are resolved would run this against an immediately-mergeable PR — and
    # `gh pr merge --auto` errors in that state ("Pull request is in clean status"). A human who
    # reopens a PR can merge it themselves.
    types: [opened, synchronize]

concurrency:
  group: dependabot-auto-merge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Dependabot auto-merge (gate)
    runs-on: ubuntu-latest
    # `github.repository` keeps this inert in forks. `user.login` is set by GitHub from the
    # authenticated actor and cannot be forged by a PR author.
    #
    # The branch-prefix test is the ecosystem allow-list, hoisted to where it runs BEFORE any
    # step does. It has to be here, not in the jq rules below: for `pull_request` the workflow
    # file is read from the merge ref, so a Dependabot PR that bumps this file's own
    # `fetch-metadata` pin would run the *replacement* action, and only afterwards reach a rule
    # that rejects the `github_actions` ecosystem. Rejecting on metadata the action itself
    # produces is too late by construction. `github.head_ref` is event data, available before the
    # first step, and Dependabot always names branches `dependabot/<ecosystem>/…`. Verified live
    # on PR #98 (`dependabot/github_actions/…`), run 31434426736: both jobs report `skipped`, so
    # `fetch-metadata` never executed. Note a job-level `if:` still *creates* a workflow run — it
    # suppresses the jobs, not the run.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.repository == 'igor-ka/llm-code-execution' &&
      startsWith(github.head_ref, 'dependabot/npm_and_yarn/')
    # Read-only. This is the job that runs third-party code.
    permissions:
      pull-requests: read
    outputs:
      verdict: ${{ steps.gate.outputs.verdict }}
    steps:
      # Pinned to the full commit SHA for v3.1.0, not @v3 — a moving tag is a supply-chain
      # rewrite waiting to happen. `alert-lookup` and `compat-lookup` stay off: both require a
      # PAT, and neither is used.
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Three rules, all fail-closed.
      #
      # Rule 1 — single commit. `fetch-metadata` verifies the PR author and then reads and
      #          signature-checks only `commits[0]`; nothing looks at commits 2..n. Auto-merge, by
      #          contrast, merges HEAD. Anyone with write access could push a second commit onto a
      #          genuine Dependabot branch and have it armed on the strength of a trailer from a
      #          commit the gate never examined. Every Dependabot PR this repository has seen
      #          carries exactly one commit, so requiring that closes the gap for free.
      #
      # Rule 2 — the ecosystem allow-list again, as defence in depth behind the job-level `if:`.
      #
      # Rule 3 — every dependency must declare patch or minor. Why not
      #          `steps.metadata.outputs.update-type`, which would be one line: on SECURITY
      #          updates Dependabot omits `update-type:` from the commit trailer entirely —
      #          verified on PR #78, whose trailer carries only dependency-name/-version/-type.
      #          The action then derives the type by parsing "Updates `x` from A to B" out of the
      #          PR body and yields "" for any entry it cannot parse (#78's esbuild line reads
      #          "Removes `esbuild`", with an empty dependency-version). `update-type` is the MAX
      #          across entries and the max skips blanks — so a security PR whose only major is an
      #          unparseable entry reports minor, and a gate reading that output would arm
      #          auto-merge on a major.
      #
      # Key names are camelCase because this output is the action's internal struct serialised
      # by @actions/core — `updateType`, `packageEcosystem` — not the kebab-case summary outputs.
      #
      # An empty `DEPS_JSON` is rejected explicitly: jq reads no values from empty input and exits
      # 0, which would leave `verdict` blank rather than failing. Malformed input does exit
      # non-zero, and `set -euo pipefail` turns that into a failed step. A failure here is safe by
      # construction — `apply` treats an unknown verdict as ineligible, never as eligible.
      - name: Decide whether this PR may auto-merge
        id: gate
        env:
          DEPS_JSON: ${{ steps.metadata.outputs.updated-dependencies-json }}
          PR_COMMITS: ${{ github.event.pull_request.commits }}
        run: |
          set -euo pipefail
          [[ -n "$DEPS_JSON" ]] || { echo "fetch-metadata produced no dependency JSON" >&2; exit 1; }

          if [[ "$PR_COMMITS" != "1" ]]; then
            verdict="not-eligible: ${PR_COMMITS} commits on the branch; only the first is verified"
          else
            verdict="$(printf '%s' "$DEPS_JSON" | jq -r '
              if type != "array" or length == 0 then "not-eligible: no dependency metadata"
              elif any(.[]; .packageEcosystem != "npm_and_yarn")
                then "not-eligible: only npm dependency bumps auto-merge"
              elif all(.[]; .updateType == "version-update:semver-patch"
                         or .updateType == "version-update:semver-minor")
                then "eligible"
              else "not-eligible: at least one dependency is not patch or minor"
              end')"
          fi

          echo "verdict=${verdict}" >> "$GITHUB_OUTPUT"
          echo "${verdict}"
          # Guarded: the bare `.[]` form dies on non-array input, which is exactly the input the
          # verdict above handles gracefully — an unguarded log line would fail the step and
          # suppress the explanation it exists to provide.
          printf '%s' "$DEPS_JSON" | jq -r '
            if type == "array"
              then .[] | "  \(.dependencyName): \(.prevVersion // "?") -> \(.newVersion // "?") [\(.updateType // "unknown")]"
              else "  (dependency metadata was not a JSON array)"
            end'

  apply:
    name: Dependabot auto-merge
    needs: gate
    runs-on: ubuntu-latest
    # `!cancelled()` rather than the implicit `success()`: if `gate` FAILS, its verdict is empty,
    # which is not 'eligible', and the disarm branch below must still run. Skipping on failure
    # would make the only mechanism that un-arms a PR fail open. `needs.gate.result != 'skipped'`
    # keeps this off PRs that were never Dependabot npm bumps in the first place.
    if: ${{ !cancelled() && needs.gate.result != 'skipped' }}
    # This job runs no third-party code — only `gh`, preinstalled on the runner.
    #
    # `contents: write` is required. It was first shipped omitted, on the argument that
    # `gh pr merge --auto` only issues the GraphQL `enablePullRequestAutoMerge` mutation and never
    # merges anything itself. The first real run disproved that: run 31432435114 on PR #117 failed
    # with
    #
    #   GraphQL: Resource not accessible by integration (enablePullRequestAutoMerge)
    #
    # and run 31432454576 failed the same way on `disablePullRequestAutoMerge`. Those runs prove
    # `pull-requests: write` alone is insufficient; that `contents: write` is what closes the gap
    # is GitHub's documented example plus the absence of any other candidate scope, and the next
    # live run is what confirms it. Do not narrow this again without a run to point at.
    permissions:
      contents: write
      pull-requests: write
    steps:
      # `--squash`, not `--merge`: the ruleset allows only squash and rebase, and
      # required_linear_history is on. GitHub's own documented example uses `--merge` and would
      # fail here.
      #
      # No `gh pr review --approve`: required_approving_review_count is 0, and the repository
      # sets can_approve_pull_request_reviews: false, so Actions could not approve anyway.
      - name: Arm auto-merge
        if: needs.gate.outputs.verdict == 'eligible'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "$PR_URL"

      # Arming is sticky, so ineligibility has to be acted on, not just logged: GitHub disables
      # auto-merge only when someone WITHOUT write permission pushes to the head branch, and
      # Dependabot has write. A grouped PR armed while patch-only and later updated in place to
      # carry a major would otherwise stay armed and merge that major unattended.
      #
      # The state is READ FIRST and acted on second, for two reasons. It distinguishes auto-merge
      # this workflow armed from auto-merge a human armed after reading the diff — revoking a
      # deliberate human decision would be its own defect, and `allow_auto_merge` is repo-wide, so
      # a human arming a major is a real scenario. And it means a failing `--disable-auto` is
      # always a hard failure, instead of being masked by a "was not armed anyway" fallback that
      # would have swallowed exactly the token-scope regression this file already hit once.
      #
      # `set +e` is not redundant: GitHub invokes steps as `bash -e {0}`, so errexit is ON before
      # the script starts and `set -uo pipefail` does not clear it. Without this, the `gh` failure
      # paths below are unreachable — the script would die at the assignment.
      - name: Disarm auto-merge if it is no longer eligible
        if: ${{ !cancelled() && needs.gate.outputs.verdict != 'eligible' }}
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERDICT: ${{ needs.gate.outputs.verdict }}
        run: |
          set +e
          set -uo pipefail

          # Identifies WHO armed auto-merge, from `is_bot` AND the login together, and fails
          # closed whenever it cannot tell. Neither signal alone is enough, and both halves of
          # that were learned the hard way — see "Auto-merging dependency bumps" in docs/sdlc.md.
          #
          # `--jq '.autoMergeRequest'` prints an EMPTY string when the field is null, not the text
          # "null" (run 31432454576). Every branch below emits two non-empty fields, so an empty
          # result still means "gh itself failed".
          #
          # `enabledBy` is a NULLABLE Actor in GraphQL — a deleted account or an uninstalled app
          # yields null — so `is_bot` can be absent rather than false. `| type` distinguishes the
          # two; a bare `// false` would read "absent" as "a human armed it" and leave an
          # ineligible PR armed, which is the failure this whole step exists to prevent.
          state="$(gh pr view "$PR_URL" --json autoMergeRequest --jq '
            if .autoMergeRequest == null then "none -"
            elif (.autoMergeRequest.enabledBy.is_bot | type) != "boolean" then "indeterminate -"
            else "\(if .autoMergeRequest.enabledBy.is_bot then "bot" else "human" end) \(.autoMergeRequest.enabledBy.login // "" | if . == "" then "unknown" else . end)"
            end')"
          rc=$?
          if [[ "$rc" -ne 0 || -z "$state" ]]; then
            echo "could not read auto-merge state (gh exit ${rc}) — refusing to assume it is disarmed" >&2
            exit 1
          fi
          read -r kind who <<<"$state"
          who="${who:-unknown}"

          if [[ "$kind" == "none" ]]; then
            echo "auto-merge was not armed — nothing to disarm"
            exit 0
          fi

          if [[ "$kind" == "indeterminate" ]]; then
            echo "auto-merge is armed but the enabling actor could not be identified." >&2
            echo "Failing closed: disarm it by hand, or fix this step if gh's payload changed." >&2
            exit 1
          fi

          # Both signals, not either. `is_bot` alone matches ANY app — including a maintainer who
          # deliberately ran `@dependabot merge` on a major after reading it — and silently
          # revoking a considered decision is its own defect. The login alone was the bug in #128.
          mine=no
          if [[ "$kind" == "bot" ]]; then
            if [[ "$who" == "github-actions" || "$who" == "app/github-actions" ]]; then
              mine=yes
            fi
          fi
          if [[ "$mine" != "yes" ]]; then
            echo "auto-merge was armed by '${who}', not by this workflow — leaving it alone."
            echo "Someone who arms auto-merge on an ineligible PR has read the diff; that stands."
            exit 0
          fi

          # An empty VERDICT means `gate` failed, not that the PR was judged ineligible. Disarming
          # is still right — an unknown verdict must not stay armed — but the log has to say which
          # it was, or it claims a judgement that was never made.
          reason="${VERDICT:-the gate produced no verdict, so eligibility is unknown}"
          if gh pr merge --disable-auto "$PR_URL"; then
            echo "auto-merge disarmed — this workflow armed it, and: ${reason}"
            exit 0
          fi
          echo "FAILED to disarm auto-merge armed by '${who}' — ${reason}" >&2
          exit 1

      # Prints why a PR was left alone, so "why did this not merge?" is answered in the run log
      # rather than by re-deriving the rule. Majors are the common case here. `!cancelled()` for
      # the same reason as the disarm step: a failed `gate` is exactly when an explanation is
      # most useful.
      - name: Explain why auto-merge was not armed
        if: ${{ !cancelled() && needs.gate.outputs.verdict != 'eligible' }}
        env:
          VERDICT: ${{ needs.gate.outputs.verdict }}
        run: |
          echo "Auto-merge not armed — ${VERDICT:-gate did not produce a verdict}."
          echo "Merge this one by hand after reading the diff."

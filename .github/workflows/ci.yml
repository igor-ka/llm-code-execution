name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Convention: job `name:` values are a contract. The "Protect main" ruleset requires
# these check names (Backend checks, Frontend checks), so renaming or removing a job
# silently breaks merges until the ruleset's required status checks are updated to match.
# Change what runs *inside* a job freely; keep its name stable. If a name must change,
# update the ruleset's required_status_checks in the same PR.
jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Postgres for the DATABASE_URL-gated integration step below. Only the "Integration test"
    # step sets DATABASE_URL, so the DB-free "Test" step still skips the Postgres suites.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Quota counters for the Redis-backed rate limiter, same DATABASE_URL-style gating:
      # only the "Integration test" step sets REDIS_URL, so the "Test" step still skips
      # the Redis suite.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # Named steps that each call a target of the shared verify.sh — the same script
      # developers run locally (`./verify.sh` runs them all). Splitting the targets here
      # gives per-step pass/fail and timing in the job log without a second definition.
      - name: Install
        run: ./verify.sh install
      - name: Audit
        run: ./verify.sh audit
      - name: Lint
        run: ./verify.sh lint
      - name: Format check
        run: ./verify.sh format
      - name: Test
        run: ./verify.sh test
      - name: Build
        run: ./verify.sh build
      # Runs the HistoryStore contract + migration suites against the service Postgres above,
      # and the QuotaStore contract suite against the service Redis.
      - name: Integration test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          REDIS_URL: redis://localhost:6379
        run: ./verify.sh test:integration
      # Build the images on PRs only — keeps pushes to main fast.
      - name: Docker build
        if: github.event_name == 'pull_request'
        run: ./verify.sh docker

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Named steps that each call a target of the shared verify.sh — the same script
      # developers run locally (`./verify.sh` runs them all). Splitting the targets here
      # gives per-step pass/fail and timing in the job log without a second definition.
      - name: Install
        run: ./verify.sh install
      - name: Audit
        run: ./verify.sh audit
      - name: Lint
        run: ./verify.sh lint
      - name: Format check
        run: ./verify.sh format
      - name: Test
        run: ./verify.sh test
      - name: Build
        run: ./verify.sh build
      # Build the image on PRs only — keeps pushes to main fast.
      - name: Docker build
        if: github.event_name == 'pull_request'
        run: ./verify.sh docker

  # The "SDLC docs" check lives in its own workflow (.github/workflows/sdlc-docs.yml)
  # because it must also trigger on `pull_request: edited` — the [skip-sdlc-sync] escape
  # hatch is read from the PR title. Adding `edited` here would re-run the full backend and
  # frontend suites, image builds included, every time someone fixes a typo in a PR title.
